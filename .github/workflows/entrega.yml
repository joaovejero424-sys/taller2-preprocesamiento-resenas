name: Generar CSV de la primera entrega
on:
  push:
    paths:
      - ".github/workflows/entrega.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: entrega-parte1
  cancel-in-progress: false
jobs:
  preparar-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Descargar y preprocesar las reseñas
        run: python -u main.py
      - name: Publicar CSV completos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/dataset.csv data/raw/origen.json data/processed/dataset_limpio.csv data/processed/ejemplos_paso_a_paso.csv data/processed/control_preprocesamiento.json
          if ! git diff --cached --quiet; then
            git commit -m "Agregar dataset completo de la API y CSV preprocesado"
            git push origin HEAD:main
          fi
